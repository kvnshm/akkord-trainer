<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Erkennungs-Test</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; }
  table { border-collapse: collapse; }
  td, th { padding: 2px 8px; border-bottom: 1px solid #ddd; text-align: left; font-variant-numeric: tabular-nums; }
  .fail { color: #b3261e; font-weight: 700; }
</style>
<h1>Erkennungs-Test</h1>
<p>Spielt synthetische Gitarrenakkorde durch dieselbe Erkennung wie der Trainer und prüft das Urteil.
  Fälle mit „–“ als Erwartung werden nur angezeigt, nicht bewertet.</p>
<p id="sum">Läuft …</p>
<table>
  <thead><tr><th>Fall</th><th>Ziel</th><th>erwartet</th><th>Urteil</th><th>Wert</th><th>bester anderer</th></tr></thead>
  <tbody id="out"></tbody>
</table>
<h2>Stimmgerät, Akkordwechsel, Bestwerte</h2>
<table>
  <thead><tr><th>Prüfung</th><th>Ergebnis</th><th>Details</th></tr></thead>
  <tbody id="more"></tbody>
</table>
<iframe id="app" hidden></iframe>
<script>
const app = document.getElementById("app");
app.onload = async () => {
  const w = app.contentWindow, CHORDS = w.eval("CHORDS"), OPEN = w.eval("OPEN_MIDI"), FFT = w.eval("FFT");
  const notesOf = (frets, detune = () => 0) => frets.flatMap((f, i) => f < 0 ? [] : [OPEN[i] + f + detune(i)]);
  const samePcs = (a, b) => { const s = new Set(a.map(m => ((Math.round(m) % 12) + 12) % 12)); return s.size === b.pcs.length && b.pcs.every(p => s.has(p)); };
  const cases = [];
  for (const c of CHORDS) {
    cases.push({ name: "richtig", target: c, notes: notesOf(c.frets), expect: true });
    cases.push({ name: "richtig, 30 Cent zu tief", target: c, notes: notesOf(c.frets, () => -0.3), expect: true });
    cases.push({ name: "richtig, Saiten ±15 Cent", target: c, notes: notesOf(c.frets, () => (Math.random() - 0.5) * 0.3), expect: true });
    cases.push({ name: "richtig, leise mit Rauschen", target: c, notes: notesOf(c.frets), gain: 0.03, noise: 0.0007, expect: true });
    // nur rund 13 dB über dem Rauschen: härter als echtes Spiel, darum nur angezeigt (die Grenze soll sichtbar bleiben)
    cases.push({ name: "richtig, sehr leise (kaum über dem Rauschen)", target: c, notes: notesOf(c.frets), gain: 0.015, noise: 0.0007, expect: undefined });
    cases.push({ name: "richtig, 44,1 kHz", target: c, notes: notesOf(c.frets), sr: 44100, expect: true });
    // gleiche Töne (Dsus2/Asus4) sind für ein Mikrofon nicht unterscheidbar und zählen beide als richtig
    for (const o of CHORDS) if (o !== c && !w.eval("sameNotes")(o, c)) cases.push({ name: "anderer Akkord: " + o.n, target: c, notes: notesOf(o.frets), expect: false });
    c.frets.forEach((f, i) => {
      if (f < 0) return;
      const up = c.frets.slice(); up[i] = f + 1;
      // Nur eine Saite daneben: wird meist, aber nicht immer erkannt (bekannte Grenze), daher nur gezählt
      if (!samePcs(notesOf(up), c)) cases.push({ name: `Saite ${"EADGHe"[i]} einen Bund zu hoch`, target: c, notes: notesOf(up), oneOff: true });
      if (f > 0) { const dn = c.frets.slice(); dn[i] = f - 1;
        if (!samePcs(notesOf(dn), c)) cases.push({ name: `Saite ${"EADGHe"[i]} einen Bund zu tief`, target: c, notes: notesOf(dn), oneOff: true }); }
    });
  }
  cases.push({ name: "nur Rauschen", target: CHORDS[0], notes: [], noise: 0.003, expect: null });
  cases.push({ name: "Klopfen", target: CHORDS[0], notes: [], knock: true, expect: null });
  cases.push({ name: "eine leere E-Saite", target: CHORDS[0], notes: [40], expect: undefined });

  const out = document.getElementById("out"), sum = document.getElementById("sum");
  let pass = 0, fail = 0, oneOff = 0, oneOffCaught = 0;
  const rows = [];
  for (const cs of cases) {
    const hist = await play(w, FFT, cs), r = hist && w.judge(hist, cs.target);
    const got = r ? r.ok : null;
    const graded = cs.expect !== undefined, okCase = !graded || got === cs.expect;
    if (graded) okCase ? pass++ : fail++;
    if (cs.oneOff) { oneOff++; if (got === false) oneOffCaught++; }
    rows.push({ name: cs.name, target: cs.target.n, expect: cs.expect, got, hist, score: r && +r.score.toFixed(3), best: r && r.best.n, bestScore: r && +r.bestScore.toFixed(3), off: r && +r.off.toFixed(2) });
    const tr = out.insertRow();
    if (!okCase) tr.className = "fail";
    [cs.name, cs.target.n, cs.expect === undefined ? "–" : cs.expect === null ? "kein Urteil" : cs.expect ? "richtig" : "falsch",
      got === null ? "kein Urteil" : got ? "richtig" : "falsch", r ? r.score.toFixed(3) : "", r ? `${r.best.n} ${r.bestScore.toFixed(3)}` : ""]
      .forEach(v => tr.insertCell().textContent = v);
    sum.textContent = `Läuft … ${pass} bestanden, ${fail} durchgefallen`;
  }
  // ---------- Stimmgerät, Akkordwechsel, Trefferquote ----------
  w.eval("store.set = () => {}"); // die Prüfungen dürfen gespeicherte Werte (Bestwerte, Trefferquote) nicht verändern
  const more = document.getElementById("more");
  const check = (name, ok, detail) => {
    const tr = more.insertRow(); if (!ok) tr.className = "fail";
    [name, ok ? "ok" : "FEHLER", detail].forEach(v => tr.insertCell().textContent = v);
    ok ? pass++ : fail++;
  };

  // Griffe nachgerechnet: jeder Griff muss genau die Töne seines Akkords ergeben (deutsche Namen, H = B)
  const TONES = { Em: "E G H", Am: "A C E", E: "E Gis H", A: "A Cis E", D: "D Fis A", Dm: "D F A", G: "G H D", C: "C E G",
    E7: "E Gis H D", A7: "A Cis E G", D7: "D Fis A C", Fmaj7: "F A C E", G7: "G H D F",
    C7: "C E B", // der übliche Griff x32310 lässt die Quinte G weg
    H7: "H Dis Fis A", Em7: "E G H D", Am7: "A C E G", Dsus2: "D E A", Dsus4: "D G A", Asus2: "A H E", Asus4: "A D E",
    Cadd9: "C D E G", F: "F A C", Hm: "H D Fis", "F#m": "Fis A Cis", H: "H Dis Fis" };
  const PCN = w.eval("PC_NAMES"), wrongTones = [];
  for (const c of CHORDS) {
    const got = c.pcs.map(p => PCN[p]).sort().join(" "), want = (TONES[c.n] || "?").split(" ").sort().join(" ");
    if (got !== want) wrongTones.push(`${c.n}: ${got} statt ${want}`);
    if (c.frets.length !== 6 || c.fingers.length !== 6 || c.frets.some((f, i) => (f > 0) !== (c.fingers[i] > 0))) wrongTones.push(`${c.n}: Finger passen nicht zu den Bünden`);
    if (c.barre && c.frets.some((f, i) => i >= c.barre[1] && i <= c.barre[2] && f < c.barre[0])) wrongTones.push(`${c.n}: Saite unter dem Barré tiefer als der Balken`);
  }
  check(`Griffe: alle ${CHORDS.length} Akkorde ergeben genau ihre Töne`, !wrongTones.length, wrongTones.join("; ") || "alle stimmen");
  check("Griffbild: Barré als Balken, keine einzelnen Punkte darunter", (() => {
    const svg = w.document.createElementNS("http://www.w3.org/2000/svg", "svg"); w.drawDiagram(CHORDS.find(c => c.n === "F"), svg);
    return svg.querySelectorAll("rect").length === 1 && svg.querySelectorAll("circle").length === 3; // 3 Finger über dem Balken, keine Leersaiten
  })(), "F-Dur: ein Balken, drei Finger");

  for (let i = 0; i < 6; i++) for (const det of [0, -0.25, 0.2]) for (const at of [0.55, 1.3]) {
    const sr = 48000, want = 440 * 2 ** ((OPEN[i] + det - 69) / 12);
    const actual = sr / (Math.round(sr / want) - 0.5); // pluck(): y[n] = ½·(y[n−N] + y[n−N+1]), schwingt also mit N − ½ Abtastwerten
    const exp = Math.round((69 + 12 * Math.log2(actual / 440) - OPEN[i]) * 100);
    const f = w.detectPitch(await pluckAt(w, want, sr, at), sr), r = f && w.tuneTarget(f, null);
    check(`Stimmgerät: Saite ${"EADGHe"[i]}, ${det ? (det > 0 ? "+" : "") + Math.round(det * 100) + " Cent" : "gestimmt"}, ${at === 0.55 ? "kurz nach" : "lange nach"} dem Anschlag`,
      !!r && r.string === i && Math.abs(r.cents - exp) <= 3, r ? `erkannt ${"EADGHe"[r.string]} ${r.cents} Cent, erwartet ${exp}` : "nichts erkannt");
  }
  check("Stimmgerät: Rauschen ergibt keinen Ton", w.detectPitch(new Float32Array(FFT).map(() => (Math.random() * 2 - 1) * 0.01), 48000) === null, "");
  check("Stimmgerät: festgehaltene Saite (A-Ton bei festgehaltener E-Saite = +500 Cent)", w.tuneTarget(110, 0).string === 0 && w.tuneTarget(110, 0).cents === 500, JSON.stringify(w.tuneTarget(110, 0)));

  const sh = w.eval(`(() => {
    stats = { Am: "0000000000", G: "1111100000", C: "1111111111" };
    enabled = ["Am", "C", "G"]; shuffle = true;
    const runs = [];
    for (let k = 0; k < 200; k++) { buildQueue(false); runs.push(queue.map(c => c.n)); }
    return runs;
  })()`);
  const cnt = (n, k) => n.filter(x => x === k).length;
  check("Gewichtung: Am (0 %) dreimal, G (50 %) zweimal, C (100 %) einmal pro Durchgang", sh.every(n => cnt(n, "Am") === 3 && cnt(n, "G") === 2 && cnt(n, "C") === 1), sh[0].join(" "));
  check("Gewichtung: in 200 Durchgängen nie derselbe Akkord direkt hintereinander", sh.every(n => n.every((x, i) => !i || x !== n[i - 1])), sh[1].join(" "));

  const rp = w.eval(`(() => {
    stats = {}; bests = {}; enabled = ["Em", "Am", "C", "G"]; shuffle = false; buildQueue(false); setMode("change");
    const keys = [];
    for (let k = 0; k < 300; k++) { pickPair(); keys.push(queue[pos] === queue[partner] ? "gleich" : pairKey()); }
    const before = pairKey(); next(false); const afterNext = pairKey();
    enabled = ["Em", "Am"]; buildQueue(true);
    const two = []; for (let k = 0; k < 30; k++) { pickPair(); two.push(pairKey()); }
    enabled = ["Em"]; buildQueue(true); render();
    const one = $("progress").textContent;
    return { keys, distinct: [...new Set(keys)].length, before, afterNext, two: [...new Set(two)], one };
  })()`);
  check("Wechsel: Paare zufällig, alle 6 möglichen Paare aus 4 Akkorden kommen vor", rp.distinct === 6 && !rp.keys.includes("gleich"), `${rp.distinct} verschiedene: ${[...new Set(rp.keys)].join(", ")}`);
  check("Wechsel: nie dasselbe Paar zweimal hintereinander", rp.keys.every((k, i) => !i || k !== rp.keys[i - 1]), rp.keys.slice(0, 8).join(" · "));
  check("Wechsel: „Weiter“ gibt ein neues Paar", rp.afterNext !== rp.before, `${rp.before} → ${rp.afterNext}`);
  check("Wechsel: bei nur zwei Akkorden immer genau dieses Paar", rp.two.length === 1 && rp.two[0] === "Am–Em", rp.two.join(", "));
  check("Wechsel: bei nur einem Akkord Hinweis, mindestens zwei auszuwählen", rp.one.includes("mindestens zwei"), rp.one);

  const ch = w.eval(`(() => {
    stats = {}; bests = {}; enabled = ["Em", "Am", "C"]; shuffle = false; buildQueue(false);
    setMode("change"); renderBests(); const empty = $("bests").textContent; running = true;
    const a = queue[pos].n, b = queue[partner].n;
    verdict({ ok: true });
    const afterStart = { pos: queue[pos].n, count: changeCount, started: changeStart > 0 };
    verdict({ ok: true }); verdict({ ok: true });
    const after = { pos: queue[pos].n, count: changeCount };
    verdict({ ok: false, score: 0.5, bestScore: 0.5, best: queue[pos], off: 0 });
    const afterMiss = { pos: queue[pos].n, count: changeCount, miss: $("chordCard").classList.contains("miss") };
    changeStart = performance.now() - 61000; changeTick(performance.now());
    const first = { key: [a, b].sort().join("–"), next: pairKey(), status: $("status").textContent, bests: $("bests").textContent, running };
    const stat = stats[a] + "|" + stats[b]; // vor der zweiten Runde, die weitere Anschläge zählt
    running = true; verdict({ ok: true }); verdict({ ok: true });
    changeStart = performance.now() - 61000; changeTick(performance.now());
    const second = { status: $("status").textContent, bests: $("bests").textContent };
    const chip = [...$("chips").children].find(x => x.textContent.startsWith("Am")).textContent;
    const res = { a, b, empty, afterStart, after, afterMiss, first, second, best: bests[first.key], stat, chip };
    setMode("timer");
    return res;
  })()`);
  check("Wechsel: erster sauberer Akkord startet die Minute, zählt aber nicht", ch.afterStart.started && ch.afterStart.count === 0 && ch.afterStart.pos === ch.b, JSON.stringify(ch.afterStart));
  check("Wechsel: jeder weitere saubere Akkord zählt und wechselt", ch.after.count === 2 && ch.after.pos === ch.b, JSON.stringify(ch.after));
  check("Wechsel: falscher Akkord zählt nicht und leuchtet rot", ch.afterMiss.count === 2 && ch.afterMiss.pos === ch.b && ch.afterMiss.miss, JSON.stringify(ch.afterMiss));
  check("Wechsel: nach 60 s Ende, Bestwert gespeichert, neues Zufallspaar", ch.best === 2 && !ch.first.running && ch.first.next !== ch.first.key
    && ch.first.status.includes("2 Wechsel") && ch.first.status.includes("Neuer persönlicher Bestwert") && ch.first.status.includes("Nächstes Paar"), ch.first.status);
  check("Wechsel: zweite Runde mit weniger Wechseln ist kein persönlicher Bestwert", !ch.second.status.includes("persönlicher") && ch.second.status.includes("Erster Bestwert für dieses Paar"), ch.second.status);
  check("Bestwerte unten: leer mit Hinweis, danach Höchstwert groß und Liste aller Paare", ch.empty.startsWith("Noch kein Bestwert")
    && ch.second.bests.startsWith("2Wechsel pro Minute") && ch.second.bests.includes(ch.first.key.replace("–", " ↔ ")), `${ch.empty} | ${ch.second.bests}`);
  check("Trefferquote: nicht mehr sichtbar, zählt aber weiter für „schwache Akkorde öfter“", ch.chip === "Am" && ch.stat === "11|10", `Taste „${ch.chip}“ · ${ch.stat}`);

  // Geführtes Stimmen: Messwerte (Hz) im 50-ms-Takt einspeisen, wie sie das Stimmgerät liefert
  const tg = w.eval(`(() => {
    tuneDone = Array(6).fill(false); tuneString(0);
    const hz = (k, c) => 440 * 2 ** ((OPEN_MIDI[k] + c / 100 - 69) / 12);
    let t = 1000;
    const feed = (f, ms) => { for (const end = t + ms; t < end; t += 50) tuneWith(t, f); };
    const st = () => $("tunerStatus").textContent, r = {};
    feed(hz(0, -20), 1500); r.low = { step: tuneStep, st: st() };
    feed(hz(0, 0), 1000); r.pass = { step: tuneStep, st: st(), done: tuneDone.join() };
    feed(hz(0, 0), 800); r.ring = { step: tuneStep, st: st() };
    feed(null, 600); feed(hz(2, 0), 1000); r.wrong = { step: tuneStep, st: st() };
    for (let k = 1; k < 6; k++) { feed(null, 1300); feed(hz(k, 2), 1000); }
    r.all = { step: tuneStep, st: st(), done: tuneDone.join(), note: $("tunerNote").textContent, chips: $("tunerStrings").textContent };
    tuneString(3); r.again = { step: tuneStep, done: tuneDone.join() };
    return r;
  })()`);
  check("Stimmen: zu tiefe E-Saite bleibt dran und sagt „Zu tief“", tg.low.step === 0 && tg.low.st.startsWith("Zu tief"), JSON.stringify(tg.low));
  check("Stimmen: E stimmt 0,7 s lang, dann Haken und weiter zur A-Saite", tg.pass.step === 1 && tg.pass.done.startsWith("true,false") && tg.pass.st.includes("Jetzt die A-Saite"), JSON.stringify(tg.pass));
  check("Stimmen: nachklingende E-Saite wird ignoriert", tg.ring.step === 1 && tg.ring.st === tg.pass.st, JSON.stringify(tg.ring));
  check("Stimmen: falsche Saite gezupft gibt Hinweis statt „Zu hoch“", tg.wrong.step === 1 && tg.wrong.st.includes("Das ist die D-Saite"), JSON.stringify(tg.wrong));
  check("Stimmen: nach allen sechs Saiten fertig", tg.all.step === -1 && tg.all.st.startsWith("Alle sechs Saiten passen") && !tg.all.done.includes("false") && tg.all.note === "✓", JSON.stringify(tg.all));
  check("Stimmen: Antippen einer Saite stimmt sie noch einmal", tg.again.step === 3 && tg.again.done === "true,true,true,false,true,true", JSON.stringify(tg.again));

  // ---------- Übung im Takt (Im-Takt-Level): Ablauf und Prüfung mit offline gespielten Akkorden ----------
  for (const L of w.eval("LEVELS").filter(L => L.type === "rhythm")) {
    const s = L.song, plan = w.songPlan(s);
    const ok = plan.beats === s.chart.split("|").length * s.beats * s.repeat
      && !plan.segs.some((g, i) => i && (g.c === plan.segs[i - 1].c || g.start !== plan.segs[i - 1].start + plan.segs[i - 1].len));
    check(`Übung „${L.t}“: Ablauf lückenlos`, ok, `${plan.bars.length} Takte, ${plan.segs.length} Akkorde im Ablauf`);
  }
  const ts = { t: "Test", a: "", bpm: 84, beats: 4, pattern: "D-DU-UDU", chart: "Em | C | G | D | Am | G D", repeat: 1 };
  const segs = w.songPlan(ts).segs, at = sb => segs.filter(g => g.start <= sb).pop().c.n, list = me => me.results.join(" ");
  let me = await songRun(w, ts, at);
  check("Übung: alles richtig gespielt, alle Akkorde grün (auch zwei Akkorde in einem Takt)", me.results.length === 7 && me.results.every(x => x === "hit"), list(me));
  me = await songRun(w, ts, at, { gain: 0.1 });
  check("Übung: leiser gespielt, trotzdem alle grün", me.results.every(x => x === "hit"), list(me));
  me = await songRun(w, ts, sb => sb >= 8 && sb < 12 ? "Am" : at(sb));
  check("Übung: Am statt G im dritten Takt, nur dieser rot", me.results[2] === "miss" && me.results.filter(x => x === "hit").length === 6, `${list(me)} · ${me.why[2]}`);
  me = await songRun(w, ts, sb => sb >= 12 && sb < 14.5 ? "G" : at(sb));
  check("Übung: zweieinhalb Schläge zu spät zu D gewechselt, rot mit Hinweis „zu spät“", me.results[3] === "miss" && me.why[3].includes("Zu spät"), `${list(me)} · ${me.why[3]}`);
  me = await songRun(w, ts, () => null);
  check("Übung: nicht gespielt, nur Metronom: alles „nicht gehört“, nichts rot", me.results.every(x => x === "quiet"), list(me));

  // ---------- Kurs ----------
  const LV = w.eval("LEVELS"), bad = [], ids = new Set(), seen = new Set(), early = [];
  for (const L of LV) {
    if (ids.has(L.id)) bad.push("doppelte id " + L.id);
    ids.add(L.id);
    if (!["tune", "chord", "change", "rhythm", "mix"].includes(L.type)) bad.push(L.id + ": unbekannte Art");
    if (L.type === "change" && !(L.target > 0)) bad.push(L.id + ": kein Ziel");
    if (L.type === "mix" && !(L.set && L.set.length >= 2)) bad.push(L.id + ": zu wenige Akkorde im Mix");
    if (L.type === "rhythm") {
      if (L.song.pattern.length !== L.song.beats * 2) bad.push(L.id + ": Muster passt nicht zur Taktart");
      for (const bar of L.song.chart.split("|")) if (!Number.isInteger(L.song.beats / bar.trim().split(/\s+/).length)) bad.push(L.id + ": Takt nicht aufteilbar");
    }
    if (L.type === "chord") seen.add(L.c);
    const used = L.type === "chord" ? [L.c] : L.type === "change" ? [L.a, L.b] : L.type === "rhythm" ? L.song.chart.split(/[|\s]+/).filter(Boolean) : L.type === "mix" ? L.set : [];
    for (const n of used) {
      if (!CHORDS.some(c => c.n === n)) bad.push(`${L.id}: unbekannter Akkord ${n}`);
      else if (!seen.has(n)) early.push(`${L.id}: ${n}`);
    }
  }
  check(`Kurs: ${LV.length} Level, Daten stimmig`, !bad.length, bad.join("; ") || LV.map(L => L.id).join(" "));
  check(`Kurs: alle ${CHORDS.length} Akkorde haben ein eigenes Level`, CHORDS.every(c => LV.some(L => L.type === "chord" && L.c === c.n)), CHORDS.filter(c => !LV.some(L => L.type === "chord" && L.c === c.n)).map(c => c.n).join(", ") || `alle ${CHORDS.length}`);
  check("Kurs: jeder Akkord wird gelernt, bevor er in Wechseln oder Übungen vorkommt", !early.length, early.join(", ") || "Reihenfolge passt");

  const cf = w.eval(`(() => {
    progress = {}; reviews = {}; const r = {}, ok = { ok: true }, bad = { ok: false, score: 0.5, bestScore: 0.6, best: CHORDS[2], off: 0 };
    r.open = [0, 1, 2].map(lvOpen);
    showLevel(1); lvRun = { L: LEVELS[1], streak: 0, count: 0, start: 0, cur: 0 };
    lvResult(ok, 1000); lvResult(ok, 2000); lvResult(bad, 3000);
    r.afterMiss = { serie: $("lvProgress").textContent, status: $("lvStatus").textContent, red: $("lvCard").classList.contains("miss") };
    lvResult(ok, 4000); lvResult(ok, 5000); r.notYet = !!progress.em; lvResult(ok, 6000);
    r.chord = { done: !!(progress.em && progress.em.done), running: !!lvRun, status: $("lvStatus").textContent, open2: lvOpen(2), next: !$("lvNextBtn").hidden, skip: !$("lvSkip").hidden };
    showLevel(3); lvRun = { L: LEVELS[3], streak: 0, count: 0, start: 0, cur: 0 };
    for (let k = 0; k < 6; k++) lvResult(ok, 1000 + k * 3000);
    r.target = lvTarget(lvRun); r.shown = $("lvChord").textContent;
    lvFinish(lvRun.count >= LEVELS[3].target, lvRun.count);
    r.changeLow = { done: !!progress["em-am"].done, best: progress["em-am"].best, status: $("lvStatus").textContent };
    lvRun = { L: LEVELS[3], streak: 0, count: 0, start: 0, cur: 0 };
    for (let k = 0; k < 9; k++) lvResult(ok, 1000 + k * 3000);
    lvFinish(lvRun.count >= LEVELS[3].target, lvRun.count);
    r.changeOk = { done: !!progress["em-am"].done, best: progress["em-am"].best };
    showLevel(0); tuneDone = [true, true, true, true, true, false]; courseAfterTune(); r.tuneHalf = !!(progress.stimmen && progress.stimmen.done);
    tuneDone = Array(6).fill(true); courseAfterTune(); r.tuneOk = !!progress.stimmen.done;
    courseRecord(LEVELS[4], false, 75); r.r75 = { done: !!progress["takt-1"].done, open5: lvOpen(5) };
    courseRecord(LEVELS[4], true, 85); r.r85 = { done: !!progress["takt-1"].done, best: progress["takt-1"].best, open5: lvOpen(5) };

    r.reviewAfterEm = reviews.Em ? reviews.Em.due - DAY() : null;

    r.list = { count: $("courseCount").textContent, locked: [...$("courseList").querySelectorAll("button.lv")].filter(b => b.disabled).length, want: LEVELS.filter((L, i) => !lvOpen(i)).length, total: LEVELS.length };
    progress = {}; reviews = {}; lvRun = null;
    return r;
  })()`);
  check("Kurs: am Anfang ist nur Level 1 offen", cf.open.join() === "true,false,false", cf.open.join());
  check("Kurs: Akkord-Level, ein Fehlversuch setzt die Serie zurück und leuchtet rot", cf.afterMiss.serie === "Serie: 0 von 3" && cf.afterMiss.red && cf.afterMiss.status.includes("Serie beginnt von vorn") && !cf.notYet, JSON.stringify(cf.afterMiss));
  check("Kurs: drei saubere hintereinander schaffen das Level und öffnen das nächste", cf.chord.done && !cf.chord.running && cf.chord.status.startsWith("Level geschafft") && cf.chord.open2 && cf.chord.next && !cf.chord.skip, JSON.stringify(cf.chord));
  check("Kurs: Wechsel-Level zeigt immer den Akkord, der als Nächstes dran ist", cf.target === "Em" && cf.shown === "Em", `${cf.target} / ${cf.shown}`);
  check("Kurs: 5 von 8 Wechseln reicht nicht, Bestwert wird trotzdem gespeichert", !cf.changeLow.done && cf.changeLow.best === 5 && cf.changeLow.status.includes("Das Ziel sind 8"), JSON.stringify(cf.changeLow));
  check("Kurs: 8 Wechsel schaffen das Level, Bestwert 8", cf.changeOk.done && cf.changeOk.best === 8, JSON.stringify(cf.changeOk));
  check("Kurs: Stimmen-Level erst geschafft, wenn alle sechs Saiten stimmen", !cf.tuneHalf && cf.tuneOk, `5 Saiten: ${cf.tuneHalf}, 6 Saiten: ${cf.tuneOk}`);
  check("Kurs: Im-Takt-Level, 75 % reicht nicht, 85 % schon", !cf.r75.done && !cf.r75.open5 && cf.r85.done && cf.r85.best === 85 && cf.r85.open5, JSON.stringify([cf.r75, cf.r85]));
  check("Kurs: Überspringen schaltet das nächste Level frei, zählt aber nicht als geschafft", cf.skip.skipped && !cf.skip.done && cf.skip.open6 && cf.skip.shown === 6 && !cf.open7, JSON.stringify(cf.skip));
  check("Kurs: Übersicht zählt nur geschaffte Level und sperrt den Rest", cf.list.count === `4 von ${cf.list.total} Leveln geschafft` && cf.list.locked === cf.list.want && cf.list.want > 40, JSON.stringify(cf.list));
  check("Wiederholen: ein geschafftes Akkord-Level ist morgen zum ersten Mal fällig", cf.reviewAfterEm === 1, `fällig in ${cf.reviewAfterEm} Tag(en)`);

  // Gemischtes Abrufen (Mix-Level)
  const mx = w.eval(`(() => {
    progress = {}; reviews = {}; const r = {}, ok = { ok: true }, bad = { ok: false, score: 0.5, bestScore: 0.6, best: CHORDS[2], off: 0 };
    const i = LEVELS.findIndex(L => L.type === "mix"), L = LEVELS[i];
    showLevel(i);
    const run = () => { lvRun = { L, seq: mixSeq(L), k: 0, first: true, clean: 0, outcomes: [] }; lvPrompt(lvRun); return lvRun; };
    let me = run();
    r.seq = me.seq.slice();
    r.hidden = $("lvDiagram").style.visibility === "hidden" && $("lvChord").textContent === me.seq[0];
    lvResult(ok, 0); lvResult(bad, 0);
    r.shownAfterMiss = $("lvDiagram").style.visibility === "visible";
    while (lvRun) lvResult(ok, 0);
    r.first = { done: !!progress[L.id].done, best: progress[L.id].best, status: $("lvStatus").textContent };
    progress = {};
    me = run();

    while (lvRun) lvResult(ok, 0);
    r.weak = { done: !!progress[L.id].done, best: progress[L.id].best, status: $("lvStatus").textContent };

  const cnt2 = n => mx.seq.filter(x => x === n).length;
  check("Mix: jeder Akkord gleich oft, nie zweimal hintereinander", mx.set.every(n => cnt2(n) === mx.seq.length / mx.set.length) && mx.seq.every((x, i) => !i || x !== mx.seq[i - 1]), mx.seq.join(" "));
  check("Mix: nur der Name, das Griffbild kommt erst nach einem Fehler", mx.hidden && mx.shownAfterMiss, `versteckt ${mx.hidden}, nach Fehler sichtbar ${mx.shownAfterMiss}`);
  check("Mix: 9 von 10 auf Anhieb schafft das Level (90 %)", mx.first.done && mx.first.best === 90 && mx.first.status.startsWith("Level geschafft"), JSON.stringify(mx.first));
  check("Mix: 7 von 10 auf Anhieb reicht nicht (70 %)", !mx.weak.done && mx.weak.best === 70 && mx.weak.status.includes("Ziel sind 80"), JSON.stringify(mx.weak));

  // Wiederholen mit wachsenden Abständen und Tagesplan
  const sr = w.eval(`(() => {
    progress = {}; reviews = {}; const r = {}, d0 = DAY(), ok = { ok: true }, bad = { ok: false, score: 0.5, bestScore: 0.6, best: CHORDS[2], off: 0 };
    r.gaps = []; for (let k = 0; k < 6; k++) { schedule("Em", true); r.gaps.push(reviews.Em.due - d0); }
    schedule("Em", false); r.afterFail = reviews.Em.due - d0;
    reviews = {}; ["Em", "Am", "E", "A", "D", "G", "C", "Dm"].forEach((n, k) => reviews[n] = { step: 1, due: d0 - k });
    r.due = dueChords();
    renderToday(); r.todayDue = { title: $("todayTitle").textContent, btn: $("todayBtn").textContent };
    reviews = { Em: { step: 1, due: d0 }, Am: { step: 2, due: d0 }, G: { step: 0, due: d0 - 1 } };
    openCourse(); startReview();
    r.review = { type: lvAt().type, set: lvAt().set.slice().sort().join(" "), skip: $("lvSkip").hidden };
    lvRun = { L: lvAt(), seq: ["Em", "Am", "G"], k: 0, first: true, clean: 0, outcomes: [] }; lvPrompt(lvRun);
    lvResult(ok, 0); lvResult(bad, 0); lvResult(ok, 0); lvResult(ok, 0);
    r.after = { Em: reviews.Em.due - d0, Am: reviews.Am.due - d0, G: reviews.G.due - d0, status: $("lvStatus").textContent, next: !$("lvNextBtn").hidden && $("lvNextBtn").textContent };
    reviews = {}; renderToday(); r.todayNew = { title: $("todayTitle").textContent, btn: $("todayBtn").textContent };
    $("course").close(); progress = {}; reviews = {}; lvRun = null;
    return r;
  })()`);
  check("Wiederholen: Abstände 1, 3, 7, 14, 30 Tage, danach bleibt es bei 30", sr.gaps.join() === "1,3,7,14,30,30", sr.gaps.join(", "));
  check("Wiederholen: nicht auf Anhieb sauber heißt morgen wieder", sr.afterFail === 1, `in ${sr.afterFail} Tag(en)`);
  check("Wiederholen: höchstens 6 pro Tag, die überfälligsten zuerst", sr.due.length === 6 && sr.due[0] === "Dm" && !sr.due.includes("Em") && !sr.due.includes("Am"), sr.due.join(", "));
  check("Heute üben: fällige Wiederholungen stehen vorn", sr.todayDue.title === "6 Akkorde wiederholen" && sr.todayDue.btn === "Wiederholung starten", JSON.stringify(sr.todayDue));
  check("Wiederholung: Em auf Anhieb (Schritt 1 → 7 Tage), Am mit Fehler (morgen), G auf Anhieb (Schritt 0 → 3 Tage)",
    sr.review.type === "review" && sr.review.set === "Am Em G" && sr.review.skip && sr.after.Em === 7 && sr.after.Am === 1 && sr.after.G === 3 && sr.after.status.includes("Am kommt morgen"), JSON.stringify([sr.review, sr.after]));
  check("Wiederholung: danach geht es zum nächsten neuen Level", sr.after.next === "Weiter zum neuen Level →", String(sr.after.next));
  check("Heute üben: ohne Wiederholungen beginnt der Kurs bei Level 1", sr.todayNew.title === "Level 1: Gitarre stimmen" && sr.todayNew.btn === "Kurs beginnen", JSON.stringify(sr.todayNew));

  sum.textContent = `Fertig: ${pass} bestanden, ${fail} durchgefallen (von ${pass + fail} bewerteten Fällen). ` +
    `Eine Saite einen Bund daneben: ${oneOffCaught} von ${oneOff} als falsch erkannt.`;
  window.__done = { pass, fail, oneOff, oneOffCaught, rows };

// Einen Song offline „spielen“: ein Takt Einzählen mit Klicks, dann Anschläge im Muster (play(sb) = Akkord bei Schlag sb oder null),
// und die Prüfung Bild für Bild (60 pro Sekunde) wie im Trainer füttern
async function songRun(w, s, play, opts = {}) {
  const FFT = w.eval("FFT"), CH = w.eval("CHORDS"), sr = 48000;
  const me = w.eval("(s, spb) => ({ s, plan: songPlan(s), spb, seg: -1, hist: null, frames: 0, results: [], why: [] })")(s, 60 / s.bpm);
  const count = s.beats, half = me.spb / 2, t0 = 0.3, total = count + me.plan.beats, dur = t0 + total * me.spb + 0.3;
  const ac = new OfflineAudioContext(1, Math.round(sr * dur), sr);
  const hp = ac.createBiquadFilter(), an = ac.createAnalyser(), g = ac.createGain();
  hp.type = "highpass"; hp.frequency.value = 100; an.fftSize = FFT; an.smoothingTimeConstant = 0; g.gain.value = opts.gain || 0.5;
  g.connect(hp); hp.connect(an); an.connect(ac.destination);
  const ticks = [];
  let voices = [];
  for (let slot = 0; slot < total * 2; slot++) {
    const when = t0 + slot * half, beat = slot / 2, sb = beat - count, p = s.pattern[slot % s.pattern.length];
    if (slot % 2 === 0) { w.tick(ac, when, beat % count === 0, hp); ticks.push(when); }
    const name = sb >= 0 && p !== "-" ? play(sb) : null;
    if (name) { for (const v of voices) v.gain.setTargetAtTime(0, when, 0.02); voices = w.strum(ac, CH.find(c => c.n === name), when, p === "U", g); }
  }
  const td = new Float32Array(FFT), fd = new Float32Array(FFT / 2);
  for (let t = 1 / 60; t < dur - 0.02; t += 1 / 60) ac.suspend(t).then(() => {
    const sb = (t - t0) / me.spb - count;
    if (sb >= 0 && sb < me.plan.beats) {
      an.getFloatTimeDomainData(td); an.getFloatFrequencyData(fd);
      let e = 0;
      for (let i = td.length - 2048; i < td.length; i++) e += td[i] * td[i];
      w.songFeed(me, sb, Math.sqrt(e / 2048), fd, sr / FFT, ticks.some(x => t >= x && t - x < 0.12));
    }
    ac.resume();
  });
  await ac.startRendering();
  w.songJudgeRest(me);
  return me;
}

// Eine einzelne Saite anschlagen und das Zeitsignal so lesen, wie es das Stimmgerät zum Zeitpunkt „at“ sieht
async function pluckAt(w, freq, sr, at) {
  const ac = new OfflineAudioContext(1, Math.round(sr * (at + 0.1)), sr);
  const hp = ac.createBiquadFilter(), an = ac.createAnalyser(), g = ac.createGain();
  hp.type = "highpass"; hp.frequency.value = 100;
  an.fftSize = w.eval("FFT"); g.gain.value = 0.1;
  g.connect(hp); hp.connect(an); an.connect(ac.destination);
  w.pluck(ac, freq, 0.4, g);
  const td = new Float32Array(an.fftSize);
  ac.suspend(at).then(() => { an.getFloatTimeDomainData(td); ac.resume(); });
  await ac.startRendering();
  return td;
}

// Ein Fall: Akkord synthetisch anschlagen (wie „Anhören“), durch Hochpass wie ein Handy-Mikrofon,
// und die Erkennung Bild für Bild (60 pro Sekunde) wie im Trainer füttern.
async function play(w, FFT, cs) {
  const sr = cs.sr || 48000, dur = 1.5, ac = new OfflineAudioContext(1, Math.round(sr * dur), sr);
  const hp = ac.createBiquadFilter(), an = ac.createAnalyser(), g = ac.createGain();
  hp.type = "highpass"; hp.frequency.value = 100;
  an.fftSize = FFT; an.smoothingTimeConstant = 0;
  g.gain.value = cs.gain || 0.1;
  g.connect(hp); hp.connect(an); an.connect(ac.destination);
  cs.notes.forEach((m, i) => w.pluck(ac, 440 * 2 ** ((m - 69) / 12), 0.4 + i * 0.015, g));
  if (cs.noise || cs.knock) {
    const nb = ac.createBuffer(1, ac.length, sr), d = nb.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (cs.knock ? (i > sr * 0.4 && i < sr * 0.43 ? 0.3 : 0) : cs.noise);
    const s = ac.createBufferSource(); s.buffer = nb; s.connect(hp); s.start(0);
  }
  const L = w.createListener(), td = new Float32Array(FFT), fd = new Float32Array(FFT / 2);
  let hist = null;
  for (let t = 1 / 60; t < dur - 0.02; t += 1 / 60) ac.suspend(t).then(() => {
    an.getFloatTimeDomainData(td); an.getFloatFrequencyData(fd);
    const ev = L.feed(t * 1000, td, fd, sr / FFT);
    if (ev.result && !hist) hist = ev.result.slice();
    ac.resume();
  });
  await ac.startRendering();
  return hist;
}
